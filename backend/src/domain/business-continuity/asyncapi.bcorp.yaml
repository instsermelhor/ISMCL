asyncapi: 2.6.0
info:
  title: Aura Business Continuity, Crisis Management & Operational Resilience (BCORP) — Event Bus
  version: 1.0.0
  description: |
    Contrato de eventos AsyncAPI do módulo P169 BCORP — Fase XIX.
    Todos os eventos são publicados no Event Bus da Plataforma Aura
    e auditados imutavelmente com assinatura SHA-256.
  contact:
    name: Instituto Ser Melhor — Business Continuity & Risk Team
    email: continuidade@sermelhor.org.br
  license:
    name: Proprietary — Instituto Ser Melhor

defaultContentType: application/json

channels:
  aura.bcorp.audit.completed.v1:
    description: Evento de auditoria de continuidade registrado (SHA-256).
    subscribe:
      operationId: onContinuityAuditCompleted
      summary: Auditoria BCORP registrada
      message:
        payload:
          type: object
          properties:
            auditId: { type: string, example: BCORP-AUD-1700000000-ABC }
            action: { type: string, example: BCP_ACTIVATED }
            subject: { type: string }
            sha256Signature: { type: string, description: Hash SHA-256 imutável }

  aura.bcorp.continuity.activated.v1:
    description: Plano Corporativo de Continuidade de Negócios (BCP) ativado.
    subscribe:
      operationId: onBusinessContinuityActivated
      summary: Plano de continuidade ativado
      message:
        payload:
          type: object
          properties:
            planId: { type: string, example: BCP-ISM-MASTER }
            activatedBy: { type: string }
            reason: { type: string }
            timestamp: { type: string }

  aura.bcorp.crisis.declared.v1:
    description: Crise corporativa declarada pelo comitê.
    subscribe:
      operationId: onCrisisDeclared
      summary: Crise declarada
      message:
        payload:
          type: object
          properties:
            crisisId: { type: string, example: CRISIS-1700000000-XYZ }
            title: { type: string }
            severity:
              type: string
              enum: [P1_CRITICAL, P2_HIGH, P3_MEDIUM, P4_LOW]
            linkedIncidentId: { type: string }

  aura.bcorp.incident.detected.v1:
    description: Novo incidente de segurança ou operacional detectado.
    subscribe:
      operationId: onIncidentDetected
      summary: Incidente detectado
      message:
        payload:
          type: object
          properties:
            incidentId: { type: string, example: INC-P1_CRITICAL-1700000000 }
            title: { type: string }
            severity:
              type: string
              enum: [P1_CRITICAL, P2_HIGH, P3_MEDIUM, P4_LOW]
            category:
              type: string
              enum: [CYBERSECURITY, INFRASTRUCTURE, NATURAL_DISASTER, OPERATIONAL, HEALTH_SAFETY, REGULATORY, REPUTATIONAL, SUPPLY_CHAIN]

  aura.bcorp.disaster.recovery.started.v1:
    description: Operação de Recuperação de Desastres (DR) iniciada.
    subscribe:
      operationId: onDisasterRecoveryStarted
      summary: Recuperação de desastres iniciada
      message:
        payload:
          type: object
          properties:
            recoveryId: { type: string, example: DR-1700000000-ABC }
            incidentId: { type: string }
            scenarioDescription: { type: string }

  aura.bcorp.disaster.recovery.completed.v1:
    description: Operação de DR concluída com medição de RTO.
    subscribe:
      operationId: onDisasterRecoveryCompleted
      summary: DR concluído
      message:
        payload:
          type: object
          properties:
            recoveryId: { type: string }
            actualRto: { type: number, description: RTO efetivo em horas }
            rtoBreach: { type: boolean, description: Se excedeu o RTO alvo }

  aura.bcorp.recovery.validation.passed.v1:
    description: Integridade dos dados e sistemas validada no pós-restauração.
    subscribe:
      operationId: onRecoveryValidationPassed
      summary: Validação de integridade aprovada
      message:
        payload:
          type: object
          properties:
            recoveryId: { type: string }
            validatedAt: { type: string }

  aura.bcorp.emergency.communication.sent.v1:
    description: Notificação de emergência disparada via multicanal.
    subscribe:
      operationId: onEmergencyCommunicationSent
      summary: Comunicação de emergência enviada
      message:
        payload:
          type: object
          properties:
            notificationId: { type: string }
            crisisId: { type: string }
            channels:
              type: array
              items:
                type: string
                enum: [EMAIL, SMS, WHATSAPP, PUSH, PORTAL, EXECUTIVE_PANEL]
            priority: { type: string }

  aura.bcorp.resilience.updated.v1:
    description: Score de resiliência operacional atualizado.
    subscribe:
      operationId: onOperationalResilienceUpdated
      summary: Resiliência operacional atualizada
      message:
        payload:
          type: object
          properties:
            reportId: { type: string }
            resilienceScore: { type: number, minimum: 0, maximum: 100 }
            overallRating:
              type: string
              enum: [EXCELLENT, GOOD, ADEQUATE, AT_RISK, CRITICAL]

  aura.bcorp.bia.calculated.v1:
    description: Análise de Impacto nos Negócios (BIA) calculada.
    subscribe:
      operationId: onBusinessImpactCalculated
      summary: Impacto nos negócios calculado
      message:
        payload:
          type: object
          properties:
            reportId: { type: string }
            processName: { type: string }
            overallCriticality:
              type: string
              enum: [LOW, MEDIUM, HIGH, CRITICAL, VITAL]
            overallScore: { type: number, minimum: 0, maximum: 100 }
