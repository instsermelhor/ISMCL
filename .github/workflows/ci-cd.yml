name: Aura Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: 🧪 Testes & Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_dev_password
          POSTGRES_DB: aura_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Gerar Prisma Client & Run Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://aura:aura_dev_password@localhost:5432/aura_dev?schema=public"
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Executar Suíte Completa de Testes Unitários & Integração
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://aura:aura_dev_password@localhost:5432/aura_dev?schema=public"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
        run: npm test -- --forceExit

  docker-build:
    name: 🐳 Docker Build & Push
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aura-backend:${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aura-frontend:${{ github.sha }}
