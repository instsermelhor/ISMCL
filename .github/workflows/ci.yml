name: Aura Platform — CI Pipeline

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# ── Permissions (Principle of Least Privilege) ──────────────────────────────
permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

# ── Environment ──────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9'

jobs:

  # ── Job 1: Lint & Type Check ─────────────────────────────────────────────
  lint-and-typecheck:
    name: '🔍 Lint & TypeScript'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci
        working-directory: .

      - name: TypeScript Check (Frontend)
        run: npm run lint

      - name: Install dependencies (backend)
        run: npm ci
        working-directory: ./backend

      - name: TypeScript Check (Backend)
        run: npx tsc --noEmit
        working-directory: ./backend

  # ── Job 2: Unit Tests with Coverage ─────────────────────────────────────
  test:
    name: '🧪 Tests & Coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aura_test
          POSTGRES_PASSWORD: aura_test_pass
          POSTGRES_DB: aura_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://aura_test:aura_test_pass@localhost:5432/aura_test

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://aura_test:aura_test_pass@localhost:5432/aura_test

      - name: Run Unit Tests with Coverage
        run: npm run test:cov
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aura_test:aura_test_pass@localhost:5432/aura_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          JWT_SECRET: test_jwt_secret_min_32_characters_required

      - name: Check Coverage Threshold (≥ 60%)
        run: |
          COVERAGE=$(cat ./backend/coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below minimum threshold of 60%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the 60% threshold"

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  # ── Job 3: Security Scanning (SAST + Dependency) ─────────────────────────
  security-scan:
    name: '🔒 Security Scan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/security-audit
            p/owasp-top-ten
            p/nodejs
          generateSarif: '1'
        env:
          SEMGREP_RULES: p/typescript p/security-audit p/nodejs

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Run Trivy (Filesystem Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Job 4: Build ──────────────────────────────────────────────────────────
  build:
    name: '🏗️ Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.aura.sermelhor.org.br
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install & Build Backend
        run: |
          npm ci
          npm run build
        working-directory: ./backend

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ github.sha }}
          path: backend/dist/
          retention-days: 7

  # ── PR Comment with Status ────────────────────────────────────────────────
  pr-comment:
    name: '💬 PR Status Comment'
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security-scan, build]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint: '${{ needs.lint-and-typecheck.result }}',
              test: '${{ needs.test.result }}',
              security: '${{ needs.security-scan.result }}',
              build: '${{ needs.build.result }}'
            };
            const allPassed = Object.values(results).every(r => r === 'success');
            const emoji = allPassed ? '✅' : '❌';
            const body = `## ${emoji} Aura CI Pipeline Results\n\n` +
              `| Job | Status |\n|-----|--------|\n` +
              Object.entries(results).map(([k, v]) => `| ${k} | ${v === 'success' ? '✅' : '❌'} ${v} |`).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
