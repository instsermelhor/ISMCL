apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-frontend
  namespace: aura-system
  labels:
    app: aura-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aura-frontend
  template:
    metadata:
      labels:
        app: aura-frontend
    spec:
      containers:
        - name: frontend
          image: aura-frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: aura-frontend-service
  namespace: aura-system
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: aura-frontend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aura-ingress
  namespace: aura-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: aura.ser-melhor.org.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aura-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aura-backend-service
                port:
                  number: 3000
