apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-redis
  namespace: aura-system
  labels:
    app: aura-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-redis
  template:
    metadata:
      labels:
        app: aura-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - containerPort: 6379
              name: redis
          envFrom:
            - secretRef:
                name: aura-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: aura-redis-service
  namespace: aura-system
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: aura-redis
