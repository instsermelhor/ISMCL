global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    platform: 'aura'
    environment: 'development'

# Arquivo de regras de alerta SLO
rule_files:
  - /etc/prometheus/alert_rules.yml

# Targets de scraping
scrape_configs:
  # ── AURA Backend API ─────────────────────────────────────────────────────────
  - job_name: 'aura-backend'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 15s
    honor_labels: true

  # ── Prometheus self-monitoring ───────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
