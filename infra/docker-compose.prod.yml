version: '3.9'

# ── Aura Platform — Docker Compose (Produção / Homologação) ──────────────────

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aura_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_secure_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-aura_prod}
    ports:
      - "5432:5432"
    volumes:
      - aura_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7.4 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aura_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-aura_redis_prod_secret} --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - aura_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aura_redis_prod_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend NestJS API ────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aura_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura_secure_prod_password}@postgres:5432/${POSTGRES_DB:-aura_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aura_redis_prod_secret}
      JWT_SECRET: ${JWT_SECRET:-aura_jwt_master_production_secret_key_2026}
      EHR_ENCRYPTION_KEY_ACTIVE: ${EHR_ENCRYPTION_KEY_ACTIVE:-v2}
      EHR_ENCRYPTION_KEY_V2: ${EHR_ENCRYPTION_KEY_V2:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Frontend React (Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aura_prod_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  aura_prod_postgres_data:
  aura_prod_redis_data:
