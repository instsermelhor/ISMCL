version: '3.9'

# ── Aura Platform — Docker Compose (Desenvolvimento Local) ───────────────────
# Foundation Platform — Prompt 131 (AFPI)
# Referências: P108 (AEDPIG), P123 (AEDA), P131 (AFPI)
#
# Serviços incluídos:
# - PostgreSQL 16 (banco de dados principal)
# - Redis 7.4    (cache e sessões)
# - MailHog      (servidor de e-mail para testes)
#
# Uso:
#   docker compose up -d          # Sobe todos os serviços
#   docker compose down           # Para todos os serviços
#   docker compose logs -f        # Logs em tempo real
#   docker compose exec postgres psql -U aura -d aura_dev

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aura_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aura-network
    labels:
      com.aura.service: "database"
      com.aura.environment: "development"

  # ── Redis 7.4 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aura_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-aura_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aura_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aura_redis_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aura-network
    labels:
      com.aura.service: "cache"
      com.aura.environment: "development"

  # ── MailHog (SMTP Testing) ─────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aura_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI
    networks:
      - aura-network
    labels:
      com.aura.service: "mail"
      com.aura.environment: "development"

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  aura_postgres_data:
    driver: local
    labels:
      com.aura.volume: "postgres-data"
  aura_redis_data:
    driver: local
    labels:
      com.aura.volume: "redis-data"

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  aura-network:
    driver: bridge
    labels:
      com.aura.network: "main"
