version: '3.9'

# ── Aura Platform — Docker Compose (Desenvolvimento Local) ───────────────────
# Foundation Platform — Prompt 131 (AFPI)
# Referências: P108 (AEDPIG), P123 (AEDA), P131 (AFPI)
#
# Serviços incluídos:
# - PostgreSQL 16 (banco de dados principal)
# - Redis 7.4    (cache e sessões)
# - MailHog      (servidor de e-mail para testes)
#
# Uso:
#   docker compose up -d          # Sobe todos os serviços
#   docker compose down           # Para todos os serviços
#   docker compose logs -f        # Logs em tempo real
#   docker compose exec postgres psql -U aura -d aura_dev

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aura_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aura-network
    labels:
      com.aura.service: "database"
      com.aura.environment: "development"

  # ── Redis 7.4 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aura_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-aura_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aura_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aura_redis_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aura-network
    labels:
      com.aura.service: "cache"
      com.aura.environment: "development"

  # ── MailHog (SMTP Testing) ─────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aura_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI
    networks:
      - aura-network
    labels:
      com.aura.service: "mail"
      com.aura.environment: "development"

  # ── PROMPT 206: OBSERVABILITY STACK ─────────────────────────────────────────

  # ── Jaeger (Distributed Tracing — OTLP HTTP + UI) ──────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: aura_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: warn
    ports:
      - "16686:16686"   # Jaeger UI → http://localhost:16686
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (usado pelo OTel SDK da API)
    networks:
      - aura-network
    labels:
      com.aura.service: "tracing"
      com.aura.environment: "development"

  # ── Prometheus (Métricas) ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: aura_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"     # Prometheus UI → http://localhost:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - aura_prometheus_data:/prometheus
    networks:
      - aura-network
    labels:
      com.aura.service: "metrics"
      com.aura.environment: "development"

  # ── Loki (Log Aggregation) ───────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.7
    container_name: aura_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"     # Loki API
    volumes:
      - aura_loki_data:/loki
    networks:
      - aura-network
    labels:
      com.aura.service: "logs"
      com.aura.environment: "development"

  # ── Grafana (Dashboards & Alertas) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: aura_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-aura_grafana_dev}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    ports:
      - "3003:3000"     # Grafana UI → http://localhost:3003
    volumes:
      - aura_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - aura-network
    labels:
      com.aura.service: "dashboards"
      com.aura.environment: "development"

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  aura_postgres_data:
    driver: local
    labels:
      com.aura.volume: "postgres-data"
  aura_redis_data:
    driver: local
    labels:
      com.aura.volume: "redis-data"
  aura_prometheus_data:
    driver: local
    labels:
      com.aura.volume: "prometheus-data"
  aura_loki_data:
    driver: local
    labels:
      com.aura.volume: "loki-data"
  aura_grafana_data:
    driver: local
    labels:
      com.aura.volume: "grafana-data"

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  aura-network:
    driver: bridge
    labels:
      com.aura.network: "main"
